name: "Test & Build"

on: [push, workflow_dispatch]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Biome (lint/format)
        run: pnpm biome ci

      - name: Test
        run: pnpm run test

      - name: Benchmark
        run: |
          set -o pipefail
          {
            echo "## Benchmark (dezi vs decimal.js)"
            echo '```'
            pnpm run bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm run build

      - name: Consumer types
        run: pnpm run check-consumer

      - name: Bundle size
        run: |
          set -o pipefail
          {
            echo "## Bundle size"
            echo '```'
            pnpm run size
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
